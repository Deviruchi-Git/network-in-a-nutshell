# ==========================================================
#  ตั้งค่าหน้าจอเขียนบทความ (Pages CMS)
#  ไฟล์นี้บอก Pages CMS ว่าเว็บเรามีอะไรบ้าง และให้แสดงช่องกรอกแบบไหน
#  แก้ label ต่างๆ ได้ตามใจ มันคือข้อความบนหน้าจอเฉยๆ
# ==========================================================

# ---------- รูปภาพ ----------
# input  = เก็บไฟล์จริงไว้ที่ไหนใน repo
# output = path ที่จะเขียนลงในบทความ (ธีม Hextra เติม path เว็บให้เองอัตโนมัติ
#          เพราะฉะนั้นใช้ /images เฉยๆ ได้ ถึงเปลี่ยนชื่อ repo ก็ไม่พัง)
media:
  input: static/images
  output: /images
  categories: [image]
  rename: safe          # เปลี่ยนชื่อไฟล์ให้ปลอดภัย เช่น "รูป 1.png" -> "rup-1.png"

content:
  # ---------- บทความ ----------
  - name: blog
    label: บทความ
    type: collection
    path: content/blog
    format: yaml-frontmatter
    exclude: [_index.md]        # ไม่ต้องแสดงหน้าปกหมวดในรายการ
    filename:
      template: "{fields.slug}.md"
      field: create             # โชว์ช่องชื่อไฟล์ตอนสร้างใหม่ จะได้เห็นและแก้ได้
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: ชื่อบทความ
        type: string
        required: true
        description: ภาษาไทยได้เต็มที่

      - name: slug
        label: ชื่อ URL (ภาษาอังกฤษ)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "ใช้ได้เฉพาะ a-z 0-9 และ - เท่านั้น เช่น bgp-route-reflector"
        description: จะกลายเป็นที่อยู่ของบทความ เช่น bgp-route-reflector

      - name: date
        label: วันที่เผยแพร่
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: cover
        label: รูปหน้าปก
        type: image
        options:
          categories: [image]
          rename: safe
        description: รูปที่โชว์ข้างชื่อบทความในหน้ารวม จะถูกครอบเป็นสัดส่วน 16:9 — ไม่ใส่ก็ได้
        
      - name: categories
        label: หมวดหมู่
        type: select
        options:
          multiple: true
          max: 2
          placeholder: เลือกหมวดหมู่
          values: [Routing, Switching, Data Center, Security, Wireless, Automation, Notes]
        description: หมวดหมู่ที่เลือกจะกลายเป็นการ์ดบนหน้าแรกอัตโนมัติ — เลือกได้ไม่เกิน 2

      - name: tags
        label: แท็ก
        type: string
        list: true
        description: คำค้นละเอียดกว่าหมวดหมู่ กดปุ่ม + เพื่อเพิ่มทีละอัน เช่น BGP, OSPF

      - name: draft
        label: เก็บเป็นฉบับร่าง (ยังไม่เผยแพร่)
        type: boolean
        default: false

      - name: body
        label: เนื้อหา
        type: rich-text
        options:
          format: markdown
          switcher: true        # มีปุ่มสลับ Editor / Source เผื่ออยากดูโค้ดดิบ
          media: true
          rename: safe

  # ---------- หน้าเกี่ยวกับ ----------
  - name: about
    label: หน้าเกี่ยวกับ
    type: file
    path: content/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: หัวข้อ
        type: string
      - name: type
        type: string
        hidden: true            # ค่าระบบ อย่าแก้
      - name: body
        label: เนื้อหา
        type: rich-text

  # ---------- หน้าแรก ----------
  # การ์ดหมวดหมู่และรายการบทความสร้างเองอัตโนมัติ ไม่ต้องมาแก้ที่นี่
  # ตรงนี้แก้ได้แค่ชื่อเว็บกับคำโปรยด้านบนสุด
  - name: homepage
    label: หน้าแรก
    type: file
    path: content/_index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: ชื่อเว็บ
        type: string
      - name: toc
        type: boolean
        hidden: true
      - name: body
        label: คำโปรยใต้ชื่อเว็บ
        type: rich-text
        description: ข้อความสั้นๆ 1-2 บรรทัด ส่วนที่เหลือของหน้าแรกสร้างเองอัตโนมัติ

settings:
  content:
    merge: true       # เก็บค่าใน front matter ที่ไม่ได้ประกาศไว้ข้างบน ไม่ให้หายตอนบันทึก
  commit:
    templates:
      create: "เพิ่ม {filename}"
      update: "แก้ไข {filename}"
      delete: "ลบ {filename}"
