# ==========================================================
#  ไฟล์ตั้งค่าหลักของเว็บ — แก้ที่นี่ที่เดียว
#  บรรทัดที่ขึ้นต้นด้วย # คือคอมเมนต์ ระบบไม่อ่าน มีไว้ให้คนอ่าน
# ==========================================================

title: Network in a Nutshell

# ภาษาของเว็บ — มีผลกับปุ่ม/ข้อความของธีม เช่น "ค้นหา" "อ่านต่อ"
languageCode: th-th
defaultContentLanguage: th

# ดึงธีม Hextra เข้ามาใช้ (ไม่ต้องโหลดไฟล์ธีมเก็บไว้เอง)
module:
  imports:
    - path: github.com/imfing/hextra

# เก็บวันที่แก้ไขล่าสุดจากประวัติ Git มาแสดงท้ายบทความ
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true      # อนุญาตให้ฝัง HTML ในบทความได้ (จำเป็นสำหรับหน้าแรก)
  highlight:
    noClasses: false    # ให้ code block ใช้สีตามธีม (รองรับ dark mode)

# ---------- เมนูด้านบน ----------
# weight = ลำดับ เลขน้อยอยู่ซ้าย
menu:
  main:
    - name: บทความ
      pageRef: /blog
      weight: 1
    - name: เกี่ยวกับ
      pageRef: /about
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    # - name: GitHub
    #   weight: 4
    #   url: "https://github.com/USERNAME/Network-in-a-Nutshell"
    #   params:
    #     icon: github

params:
  description: บันทึกสรุปความเข้าใจเรื่อง network จากที่อ่านและศึกษามา

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system     # system = ตามเครื่องผู้อ่าน | เลือก light หรือ dark ก็ได้
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  # ปุ่ม "แก้ไขหน้านี้" ท้ายบทความ
  # ถ้าอยากเปิด: เปลี่ยน enable เป็น true แล้วแก้ USERNAME ให้ตรงกับของคุณ
  editURL:
    enable: false
    base: "https://github.com/USERNAME/Network-in-a-Nutshell/edit/main/content"

  page:
    width: normal       # normal | wide | full

  blog:
    list:
      displayTags: true
